name: Debug PATH
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  claude:
    runs-on: [self-hosted, foo]
    if: contains(github.event.comment.body, '@claude')
    container:
      image: golang:1.24-bullseye

    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Modify PATH for Claude
        run: |
          # Print original PATH
          echo "Original PATH: $PATH"

          # Add standard paths that might be missing in container
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          echo "Modified PATH: $PATH"

          # Make PATH available to next steps
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Create prompt file
        run: |
          mkdir -p /tmp/claude-prompts
          cat > /tmp/claude-prompts/prompt.txt << 'EOF'
          Please help debug a GitHub Action issue related to PATH in self-hosted runners with containers.

          The issue is that when running in a container on a self-hosted runner, the PATH environment variable
          might not include standard system paths, causing commands to fail.

          Please:
          1. Try to run a simple command like `echo "Hello World"`
          2. Explain what you observe about the environment
          3. Suggest a fix for the PATH issue in self-hosted runners with containers
          EOF

      - name: Run Claude Code Base Action
        uses: anthropics/claude-code-base-action@v0.0.18
        with:
          prompt_file: /tmp/claude-prompts/prompt.txt
          allowed_tools: "Bash,Read,Edit,Write,Grep,Task,Replace"
          model: "claude-3-haiku-20240307"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        env:
          # Pass the modified PATH to Claude
          PATH: ${{ env.PATH }}
