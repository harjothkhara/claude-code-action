name: Debug PATH
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  claude:
    runs-on: [self-hosted, foo]
    if: contains(github.event.comment.body, '@claude')
    container:
      image: golang:1.20-bullseye

    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print container PATH
        run: echo "$PATH"

      - name: Print Go version
        run: go version

      - name: Create prompt file
        run: |
          mkdir -p /tmp/claude-prompts
          cat > /tmp/claude-prompts/prompt.txt << 'EOF'
          Please run the following commands and explain what you see in the output:
          1. echo $PATH
          2. go version

          What do these outputs tell us about the container environment?
          EOF

      - name: Run Claude Code Base Action
        uses: anthropics/claude-code-base-action@v0.0.18
        with:
          prompt_file: /tmp/claude-prompts/prompt.txt
          allowed_tools: "Bash(echo $PATH),Bash(go version),Read,Edit,Write,Grep,Task,Replace"
          model: "claude-3-haiku-20240307"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
