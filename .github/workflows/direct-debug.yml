name: Direct Debug
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  debug:
    runs-on: [self-hosted, foo]
    if: contains(github.event.comment.body, '@debug')
    container:
      image: golang:1.20-bullseye

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect Environment Info
        id: env_info
        run: |
          PATH_INFO=$(echo $PATH)
          GO_INFO=$(go version)
          echo "PATH_INFO=$PATH_INFO" >> $GITHUB_OUTPUT
          echo "GO_INFO=$GO_INFO" >> $GITHUB_OUTPUT

      - name: Post Comment with Results
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const pathInfo = '${{ steps.env_info.outputs.PATH_INFO }}';
            const goInfo = '${{ steps.env_info.outputs.GO_INFO }}';

            github.rest.issues.createComment({
              issue_number: issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Environment Debug Results

              ### PATH
              \`\`\`
              ${pathInfo}
              \`\`\`

              ### Go Version
              \`\`\`
              ${goInfo}
              \`\`\`

              This information was collected directly from the container environment.`
            });
